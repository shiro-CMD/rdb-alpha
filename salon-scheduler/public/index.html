<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Salon Scheduler</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="text-center mb-12">
      <h1 class="text-4xl font-extrabold text-indigo-900 tracking-tight">GLAMOUR SALON</h1>
      <p class="text-slate-500 mt-2">Book your luxury experience instantly</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Appointment Booking Form -->
      <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-900 mb-6">Book an Appointment</h2>
        
        <form id="appointmentForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Your Name</label>
            <input type="text" id="custName" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-indigo-600">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Phone Number</label>
            <input type="tel" id="custPhone" placeholder="123-456-7890" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-indigo-600">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Select Service</label>
            <select id="serviceSelect" required class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white focus:outline-indigo-600">
              <!-- Services loaded dynamically -->
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Date & Time</label>
            <input type="datetime-local" id="appTime" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-indigo-600">
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200 cursor-pointer">
            Confirm Booking
          </button>
        </form>

        <div id="statusMessage" class="mt-4 hidden p-3 rounded-lg text-sm font-medium"></div>
      </div>

      <!-- Live Schedule View -->
      <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-900 mb-6">Live Appointment Dashboard</h2>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-100 text-slate-400 text-sm font-semibold">
                <th class="pb-3">Time</th>
                <th class="pb-3">Client</th>
                <th class="pb-3">Service</th>
                <th class="pb-3">Price</th>
              </tr>
            </thead>
            <tbody id="scheduleBuffer" class="divide-y divide-slate-100 text-sm">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
          <div id="emptyState" class="text-center py-12 text-slate-400 hidden">
            No appointments scheduled for today yet.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
